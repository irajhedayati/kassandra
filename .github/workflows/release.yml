name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - hotfix
          - minor
          - major

# Opt JavaScript actions (including actions/setup-node@v4) onto Node 26.
# Node 20 was deprecated 2026-06-16 and will be removed 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      # 1. Bump version. `npm version --workspaces --include-workspace-root`
      # keeps the root and all three workspaces (shared/server/client) in
      # lock-step. --no-git-tag-version because we tag manually below.
      - name: Bump version
        id: version
        run: |
          case "${{ github.event.inputs.release_type }}" in
            major)  bump=major ;;
            minor)  bump=minor ;;
            hotfix) bump=patch ;;
            *) echo "Unknown release_type: ${{ github.event.inputs.release_type }}"; exit 1 ;;
          esac
          npm version "$bump" --workspaces --include-workspace-root --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keep the Helm chart in lock-step with the app version.
      - name: Bump Helm chart version
        run: |
          sed -i -E \
            -e 's/^version: .*/version: ${{ steps.version.outputs.version }}/' \
            -e 's/^appVersion: .*/appVersion: "${{ steps.version.outputs.version }}"/' \
            charts/kassandra/Chart.yaml

      # 2. Commit and tag
      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json shared/package.json server/package.json client/package.json charts/kassandra/Chart.yaml
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD
          git push origin "v${{ steps.version.outputs.version }}"

      # 3. Build and push the Docker image at the new tag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hedayati
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hedayati/kassandra:${{ steps.version.outputs.version }}
            hedayati/kassandra:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Package the Helm chart and push it to GHCR as an OCI artifact
      # (helm install oci://ghcr.io/<owner>/charts/kassandra --version <v>).
      - name: Push Helm chart to GHCR
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm package charts/kassandra --destination .helm-out
          helm push .helm-out/kassandra-${{ steps.version.outputs.version }}.tgz \
            "oci://ghcr.io/${owner}/charts"

      # 5. Create the GitHub Release. Prefer handwritten notes checked in at
      # docs/release-notes/v<version>.md; fall back to GitHub's generated notes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          notes_file="docs/release-notes/${tag}.md"
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          else
            echo "No $notes_file found; generating notes from merged PRs."
            notes_args=(--generate-notes)
          fi
          gh release create "$tag" \
            --title "$tag" \
            "${notes_args[@]}" \
            --target "$(git rev-parse HEAD)"
