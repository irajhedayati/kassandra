name: Tests

on:
  pull_request:
  workflow_dispatch:

# Opt JavaScript actions onto Node 24 (same as the other workflows).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Server and client resolve @kassandra/shared from its build output.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Starts throwaway PostgreSQL, MySQL and Firestore-emulator containers (Docker is preinstalled on the runner).
      - name: Integration tests
        run: npm run test:integration
