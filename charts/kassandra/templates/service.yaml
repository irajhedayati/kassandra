apiVersion: v1
kind: Service
metadata:
  name: {{ include "kassandra.fullname" . }}
  labels:
    {{- include "kassandra.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "kassandra.selectorLabels" . | nindent 4 }}
